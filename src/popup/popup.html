<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cookie Sync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <!-- Header Bar -->
      <header class="app-header">
        <div class="brand-group">
          <div class="target-icon-wrap" id="target-badge-icon">
            <svg class="icon-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </div>
          <div>
            <div class="mode-badge">
              <span class="status-dot"></span>
              <span id="mode-label">E2E Encrypted</span>
            </div>
            <h1 id="title">Cookie Sync</h1>
          </div>
        </div>
        <div class="crypto-chip" title="AES-GCM-256 Client Encryption">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>AES-256</span>
        </div>
      </header>

      <!-- Settings Section (Collapsible) -->
      <section class="card settings-card" id="settings-section">
        <div class="card-header clickable" id="settings-header" role="button" tabindex="0" title="Click to toggle credentials panel">
          <span class="card-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            Supabase Credentials
          </span>
          <div class="card-header-right">
            <span class="badge-status" id="settings-status-badge">Setup</span>
            <svg class="chevron-icon" id="settings-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>
        <div class="settings-body" id="settings-body">
          <div class="settings-grid">
            <label class="field-group">
              <span class="field-label">Supabase URL</span>
              <div class="input-wrap">
                <input id="supabase-url" type="url" placeholder="https://project-ref.supabase.co" spellcheck="false" />
              </div>
            </label>
            
            <label class="field-group">
              <span class="field-label">Supabase Anon Key</span>
              <div class="input-wrap">
                <input id="supabase-anon-key" type="password" autocomplete="off" spellcheck="false" placeholder="eyJhbGci..." />
              </div>
            </label>

            <label class="field-group">
              <span class="field-label" id="sync-id-label">Sync ID</span>
              <div class="field-row">
                <div class="input-wrap">
                  <input id="sync-id" type="text" autocomplete="off" spellcheck="false" placeholder="Unique sync identifier..." />
                </div>
                <button id="copy-sync-id" class="btn btn-secondary btn-icon-text" type="button" title="Copy Sync ID">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                  </svg>
                  <span>Copy</span>
                </button>
              </div>
            </label>

            <label class="field-group">
              <span class="field-label">Sync Passphrase</span>
              <div class="input-wrap has-action">
                <input id="passphrase" type="password" autocomplete="new-password" placeholder="Enter encryption passphrase..." />
                <button type="button" class="btn-toggle-password" id="toggle-passphrase" title="Toggle password visibility" tabindex="-1">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </label>

            <div class="checkboxes-save-row">
              <div class="checkboxes-wrap">
                <label class="check-row">
                  <input id="remember-passphrase" type="checkbox" />
                  <span class="check-custom"></span>
                  <span class="check-text">Remember passphrase on this device</span>
                </label>

                <label class="check-row">
                  <input id="auto-sync-enabled" type="checkbox" />
                  <span class="check-custom"></span>
                  <span class="check-text">Auto sync once per day on browser startup</span>
                </label>
              </div>

              <button id="save-settings" class="btn btn-primary btn-save-side" type="button" title="Save Configuration">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                  <polyline points="17 21 17 13 7 13 7 21"></polyline>
                  <polyline points="7 3 7 8 15 8"></polyline>
                </svg>
                <span>Save</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Firefox Site Picker Section -->
      <section id="site-picker" class="card picker-card" hidden>
        <div class="site-toolbar">
          <button id="load-sites" class="btn btn-secondary btn-icon-text" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>Load server sites</span>
          </button>
          
          <label id="select-all-wrap" class="check-button" hidden>
            <input id="select-all-sites" type="checkbox" />
            <span class="check-custom"></span>
            <span>Select all</span>
          </label>

          <button id="expand-sites" class="btn btn-ghost" type="button" hidden>Expand list</button>
        </div>

        <div class="search-wrap">
          <input id="site-search" type="search" placeholder="Search domains..." hidden />
        </div>
        <div id="sites" class="sites-list"></div>
      </section>

      <!-- Primary Actions Deck -->
      <section class="actions">
        <button id="upload-now" data-direction="push" class="btn btn-hero btn-full" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span>Upload cookies now</span>
        </button>

        <button id="import-now" class="btn btn-hero btn-full" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Import selected sites</span>
        </button>

        <button id="delete-remote-data" class="btn btn-danger btn-full" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>Delete database data</span>
        </button>

        <button id="clear-all-cookies" class="btn btn-secondary btn-full" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>Clear all local cookies</span>
        </button>
      </section>

      <!-- Status Console -->
      <footer class="status-footer" id="status-footer">
        <div class="status-header clickable" id="status-header" role="button" tabindex="0" title="Click to expand/collapse Activity Log">
          <div class="status-title-wrap">
            <span class="status-title">Activity Log</span>
            <svg class="chevron-icon" id="status-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
          <div id="last-synced-box" class="last-synced-box">
            <span class="last-synced-label">Last synced:</span>
            <span id="last-synced-text" class="last-synced-text">Never</span>
          </div>
        </div>
        <div id="status" role="status" class="status-console"></div>
      </footer>
    </main>
    <script src="./popup.js"></script>
  </body>
</html>
