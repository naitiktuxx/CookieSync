name: Release

# Triggers on any tag matching v* (e.g. v1.0.0):
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Verify package and manifest versions match release tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          for f in manifests/chromium.json manifests/gecko.json; do
            MANIFEST_VERSION=$(node -p "require('./$f').version")
            if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::$f version ($MANIFEST_VERSION) does not match tag ($TAG_VERSION)"
              exit 1
            fi
          done

      - name: Package Release Artifacts & Generate Changelog
        run: npm run package

      - name: Sign Firefox Receiver with AMO (if credentials configured)
        if: ${{ env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != '' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx web-ext sign \
            --source-dir=dist/gecko \
            --artifacts-dir=web-ext-artifacts \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET" \
            --channel=unlisted
          cp web-ext-artifacts/*.xpi "CookieSync-Firefox-Receiver-${GITHUB_REF_NAME}.xpi" || true
          sha256sum CookieSync-Chromium-Host-*.zip CookieSync-Firefox-Receiver-*.xpi > SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CookieSync-Chromium-Host-*.zip
            CookieSync-Firefox-Receiver-*.xpi
            SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
